name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      full_suite:
        description: Ejecutar la suite completa de consolidación
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  detect-impact:
    name: Detectar impacto
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      components: ${{ steps.impact.outputs.components }}
      test_components: ${{ steps.impact.outputs.test_components }}
      has_components: ${{ steps.impact.outputs.has_components }}
      has_test_components: ${{ steps.impact.outputs.has_test_components }}
      e2e_journeys: ${{ steps.impact.outputs.e2e_journeys }}
      has_e2e_journeys: ${{ steps.impact.outputs.has_e2e_journeys }}
      e2e_browsers: ${{ steps.impact.outputs.e2e_browsers }}
      docs_only: ${{ steps.impact.outputs.docs_only }}
      full_suite: ${{ steps.impact.outputs.full_suite }}
      needs_build: ${{ steps.impact.outputs.needs_build }}
      needs_typecheck: ${{ steps.impact.outputs.needs_typecheck }}
      needs_database: ${{ steps.impact.outputs.needs_database }}
      consolidation: ${{ steps.impact.outputs.consolidation }}
    steps:
      - name: Descargar repositorio e historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Seleccionar componentes y suites
        id: impact
        run: node scripts/ci/detect-affected-components.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_FULL_SUITE: >-
            ${{ github.event_name != 'pull_request' ||
                inputs.full_suite == true ||
                (github.base_ref == 'main' && startsWith(github.head_ref, 'architecture/08-')) }}
          CONSOLIDATION_RUN: >-
            ${{ github.event_name != 'pull_request' ||
                (github.base_ref == 'main' && startsWith(github.head_ref, 'architecture/08-')) }}

  changed-quality:
    name: Calidad de archivos modificados
    needs: detect-impact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar repositorio e historial
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js y caché npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Verificar formato
        run: npm run format:check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_ALL: ${{ needs.detect-impact.outputs.consolidation }}

      - name: Ejecutar ESLint
        run: npm run lint:changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECK_ALL: ${{ needs.detect-impact.outputs.consolidation }}

      - name: Verificar tipos
        if: needs.detect-impact.outputs.needs_typecheck == 'true'
        run: npm run typecheck

  component-tests:
    name: Pruebas · ${{ matrix.component }}
    needs: detect-impact
    if: >-
      needs.detect-impact.outputs.has_test_components == 'true' &&
      needs.detect-impact.outputs.full_suite != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.detect-impact.outputs.test_components) }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js y caché npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar pruebas y cobertura del componente
        run: npm run test:component -- ${{ matrix.component }} --coverage

      - name: Publicar cobertura del componente
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.component }}
          path: coverage/components/${{ matrix.component }}
          if-no-files-found: warn
          retention-days: 14

  consolidated-tests:
    name: Suite completa y cobertura
    needs: detect-impact
    if: needs.detect-impact.outputs.full_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js y caché npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar suite completa con cobertura
        run: npm run test:coverage

      - name: Publicar cobertura consolidada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-full
          path: coverage
          if-no-files-found: error
          retention-days: 14

  database-tests:
    name: Migraciones, RLS e integridad PostgreSQL
    needs: detect-impact
    if: needs.detect-impact.outputs.needs_database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Iniciar PostgreSQL y servicios locales
        run: supabase start

      - name: Reconstruir una base vacía desde migraciones
        run: supabase db reset --local

      - name: Ejecutar pruebas pgTAP de RLS e integridad
        run: supabase test db

      - name: Configurar Node.js y cache npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Ejecutar integracion transaccional contra PostgreSQL real
        run: >-
          npm exec -- vitest run --project server
          src/modules/pos/__tests__/critical-domain.integration.test.ts
          --coverage --coverage.reportsDirectory=coverage/database-integration
        env:
          RUN_DATABASE_INTEGRATION: "1"
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          VITEST_COVERAGE_INCLUDE: >-
            ["src/modules/pos/server/**/*.ts","src/modules/pos/cash-flow.ts","src/modules/services/server/**/*.ts"]

      - name: Publicar cobertura de integracion transaccional
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-database-integration
          path: coverage/database-integration
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E · ${{ matrix.browser }}
    needs:
      - detect-impact
      - changed-quality
    if: >-
      needs.detect-impact.outputs.has_e2e_journeys == 'true' &&
      needs.detect-impact.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.detect-impact.outputs.e2e_browsers) }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js y caché npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Instalar navegador y dependencias del sistema
        run: npx playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Iniciar Supabase y reconstruir la base E2E
        run: |
          supabase start
          supabase db reset --local

      - name: Exponer credenciales efímeras de Supabase
        shell: bash
        run: |
          supabase status -o env > supabase-status.env
          set -a
          source supabase-status.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - name: Compilar la aplicación para producción
        run: npm run build

      - name: Ejecutar recorridos seleccionados
        run: npm run test:e2e:ci -- ${{ matrix.browser }}
        env:
          E2E_JOURNEYS: ${{ needs.detect-impact.outputs.e2e_journeys }}
          E2E_FULL_SUITE: ${{ needs.detect-impact.outputs.consolidation }}

      - name: Publicar diagnóstico E2E si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build de producción
    needs:
      - detect-impact
      - changed-quality
    if: needs.detect-impact.outputs.needs_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Restaurar caché de Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Configurar Node.js y caché npm
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Compilar aplicación
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SECRET_KEY: test-service-role-key
